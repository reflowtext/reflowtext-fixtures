; ===========================================================================
; meridian-settlement: production configuration, EU-West
;
; Values here are the defaults for every node in the region. A node may
; override any key in /etc/meridian/settlement.local.ini, which is read
; after this file. Environment variables of the form SETTLE__SECTION__KEY
; win over both.
;
; Durations accept ms, s, m and h. Sizes accept KiB, MiB and GiB.
; ===========================================================================

[service]
name            = meridian-settlement
region          = eu-west
; Where the business day ends. Batches seal at local midnight here, so a
; change to this value moves money between days: coordinate with Finance.
business_tz     = Europe/Dublin
cutoff_time     = 00:00:00
listen          = 0.0.0.0:8080
admin_listen    = 127.0.0.1:9090
shutdown_grace  = 45s

[ledger]
; The primary takes every write. The replica serves reports only.
primary_url       = postgresql://ledger-primary.internal:5432/ledger
replica_url       = postgresql://ledger-replica.internal:5432/ledger
user              = settle_rw
password          = REPLACE_ME
pool_min          = 4
pool_max          = 32
statement_timeout = 15s
; SERIALIZABLE is required: netting reads and writes the same batch rows.
isolation         = serializable
retry_serialization_failures = 5

[kafka]
brokers         = kafka-1.internal:9093, kafka-2.internal:9093, kafka-3.internal:9093
group_id        = settlement-v3
topics          = ledger.captures, ledger.refunds, ledger.disputes
security        = SASL_SSL
sasl_mechanism  = SCRAM-SHA-512
sasl_user       = settlement
sasl_password   = REPLACE_ME
max_poll_records = 1000
; Commit only after a batch delta is durable in the ledger.
enable_auto_commit = false

[netting]
workers             = 6
flush_interval      = 2s
flush_max_records   = 5000
; Currencies netted in parallel rather than one after another. Turned on
; in 3.14; switch off here first if batch totals ever disagree with the
; ledger's own daily sums.
parallel_currencies = true

[fx]
provider        = kestrel
refresh         = 15m
; Use a rate up to this old; after it, conversions stop and the affected
; lines wait rather than settle at a stale price.
max_age         = 60m
pairs_file      = /etc/meridian/fx-pairs.txt

[fees]
; Basis points, unless a merchant has its own schedule.
default_card_bps       = 140
default_wallet_bps     = 160
default_bank_bps       = 40
fixed_fee_minor        = 10
chargeback_fee_minor   = 1500
; Round half to even, so half-cent fees do not drift in one direction.
rounding               = half_even

[payouts]
enabled         = true
schedule        = daily
release_time    = 16:00
; Hold a payout when its batch still has unmatched lines after
; reconciliation. Never set this to false in production.
hold_on_unmatched = true
min_payout_minor  = 100
bank_gateway_url  = https://bank-gateway.internal/v2
bank_timeout      = 20s

[webhooks]
max_attempts    = 8
; Backoff between attempts: 30s, 2m, 10m, 30m, 1h, then hourly.
backoff         = 30s, 2m, 10m, 30m, 1h
signing_secret  = REPLACE_ME

[reports]
output_dir      = /var/lib/meridian/reports
formats         = csv, json
csv_delimiter   = ,
csv_bom         = false
retain_days     = 400

[rate_limit]
; Per API client, per node.
requests_per_minute = 120
burst               = 40

[logging]
level           = info
format          = text
; Per-logger overrides
level.c.m.settle.netting = debug
level.o.e.jetty          = warn
access_log      = /var/log/meridian/settlement-access.log

[metrics]
enabled         = true
prometheus_path = /metrics
histogram_buckets_ms = 5, 10, 25, 50, 100, 250, 500, 1000, 2500

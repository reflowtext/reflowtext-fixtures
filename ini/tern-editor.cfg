# Halcyon Instruments - Tern patch editor
# Per-user preferences. The editor rewrites this file when you change a
# setting in its Preferences window; comments you add here are kept.
#
# Booleans accept yes/no, true/false, on/off.

[general]
language = en
check_for_updates = yes
# How long to keep undo history for an open patch.
undo_depth = 200
autosave = on
autosave_interval = 90s
open_last_bank_on_start = yes

[midi]
# Port names exactly as the operating system lists them.
input_port = Tern MIDI 1
output_port = Tern MIDI 1
channel = 1
# Send every knob movement to the hardware as you drag (live) or only when
# you release the mouse (on-release). Live is smoother but busier.
send_mode = live
sysex_chunk_bytes = 256
sysex_chunk_delay_ms = 12
thru = off

[sync]
clock_source = internal
tempo = 112
swing = 54%
send_clock = no

[audio_preview]
# Previews render on the computer, not the hardware.
enabled = yes
device = default
sample_rate = 48000
buffer_frames = 256
volume_db = -9

[display]
theme = dusk
# Knobs respond to vertical drags; hold Alt for fine control.
knob_drag = vertical
knob_fine_ratio = 0.1
show_values_on_hover = yes
font_scale = 1.0
step_grid_columns = 16

[library]
banks_dir = ~/Documents/Tern/Banks
backups_dir = ~/Documents/Tern/Backups
# Keep this many timestamped backups per bank, oldest removed first.
keep_backups = 12
default_author = tidewriter
tag_suggestions = bass, lead, pad, pluck, keys, texture, fx, drum, sequence

[firmware]
channel = stable
# Back up the hardware's patches before any firmware update.
backup_before_update = yes
last_known_version = 1.9.4

[shortcuts]
randomize_patch = Ctrl+Shift+R
compare_to_saved = C
send_to_hardware = Ctrl+Enter
init_patch = Ctrl+Shift+N
next_patch = ]
previous_patch = [

[export]
# Formats offered by File > Export. The first one is the default.
formats = tbank, syx, json
# Name exported files after the bank, the date, or both.
file_naming = bank-date
date_format = %Y-%m-%d
include_comments = yes
# Strip the author field when sharing a bank publicly.
anonymize_author_on_share = yes

[randomizer]
# Ranges the Randomize command stays inside, as fractions of each knob's
# full travel. Narrow ranges give "variations"; wide ones give surprises.
amount = 0.35
lock_oscillator_octaves = yes
lock_envelope_attack = no
cutoff_range = 0.15 - 0.85
resonance_range = 0.00 - 0.70
keep_fx = yes

[controllers]
# Map hardware CC numbers to editor parameters. Leave a value empty to
# unmap it. Inline notes after ';' name the usual controller.
cc1  = vcf.cutoff          ; mod wheel
cc2  = lfo.to_cutoff       ; breath
cc7  = vca.level
cc11 =
cc71 = vcf.resonance
cc74 = vcf.cutoff
cc73 = env.attack
cc72 = env.release

[hardware.tern-studio]
# One section per connected unit, keyed by its USB serial nickname.
serial_nickname = tern-studio
firmware_seen = 1.9.4
global_tune_cents = -3
velocity_curve = soft
local_control = off

[hardware.tern-travel]
serial_nickname = tern-travel
firmware_seen = 1.9.2
global_tune_cents = 0
velocity_curve = linear
local_control = on

[advanced]
# Log every SysEx byte to the console. Slow; for troubleshooting only.
sysex_trace = off
log_file = ~/Library/Logs/TernEditor/editor.log
log_level = warning
